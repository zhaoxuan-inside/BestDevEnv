# devspace 内核参数（cfg-map: sysctl-devspace；落位 /etc/sysctl.d/99-devspace.conf）
# v0.19 系统优化默认集：低风险高收益项；每项语义见注释，回滚 = 删本文件重跑 devenv cfg apply
# inotify：前端 Vite/webpack 文件 watch 必需
fs.inotify.max_user_watches=524288
fs.inotify.max_user_instances=1024
# 换页保守：开发机内存换出代价高（编译中间态被换出比 IO 等待更伤）；数据库/容器宿主通用实践
vm.swappiness=10
# dentry/inode 缓存保留倾向：目录树遍历（git status/构建）受益，内存压力时正常回收
vm.vfs_cache_pressure=50
# 全局文件句柄上限（用户级 nofile 见 limits-devspace；容器/大仓库场景）
fs.file-max=2097152
