# Gradle 全局配置（cfg-map: gradle-properties；copy-expand 落 $GRADLE_USER_HOME=② cache/gradle）
# v0.19：性能/缓存全局化。注意：依赖镜像（阿里云）属项目级 settings/build 配置，无法全局注入——
# 全局可注入的只有缓存重定向（env.sh GRADLE_USER_HOME）与本文件，新项目请按仓库模板配 mirror。
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
