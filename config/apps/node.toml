# 应用档案：node（S2 重点层批量建档 2026-11-14；四问预填自现有契约，缺口留空待补）
[meta]
name = "node"
kind = "toolchain"
summary = "JS 运行时（NVM_DIR ①；包缓存 ③）"

[install]
scope = "user"
at = "user:nvm"
via = "nvm"
verify = "node --version"

[config]
via = "待收编"

[data]
scope = "shared"
at = "shared:Cache/linux/npm"
dump = ""

[logs]
at = "host:Logs/node"
