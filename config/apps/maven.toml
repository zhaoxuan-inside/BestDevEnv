# 应用档案：maven（构建缓存落点契约样板）
[meta]
name = "maven"
kind = "toolchain"
summary = "构建工具链（缓存不落家目录）"

[install]
scope = "system"
via = "apt maven"
verify = "mvn -version"

[config]
manifest = "dot_m2/settings.xml"           # ③ 种子（chezmoi 管应用层）
applied = "~/.m2/settings.xml"
via = "chezmoi"

[data]
scope = "host"                              # ② 主机级缓存
path = "cache/m2"                           # localRepository + MAVEN_OPTS 双保险
dump = ""

[commands]
health = "mvn -version"
