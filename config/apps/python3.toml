# 应用档案：python3（S2 重点层批量建档 2026-11-14；四问预填自现有契约，缺口留空待补）
[meta]
name = "python3"
kind = "toolchain"
summary = "系统 Python（venv → ① Venv；pip 缓存 ③）"

[install]
scope = "system"
via = "apt python3.12"
verify = "python3 --version"

[config]
via = "待收编"

[data]
scope = "shared"
at = "shared:Cache/linux/pip"
dump = ""

[logs]
at = "host:Logs/python3"
