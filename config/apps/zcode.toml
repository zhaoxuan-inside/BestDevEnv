# 应用档案：zcode（S2 重点层批量建档 2026-11-14；四问预填自现有契约，缺口留空待补）
[meta]
name = "zcode"
kind = "agent"
summary = "AI CLI（本会话运行时）"

[install]
scope = "user"
at = "~/.zcode"          # 实体家目录散装——迁移候选
via = "installer"
verify = "zcode --version"

[config]
via = "agents ③ 正本（runtime wire）"

[logs]
at = "host:Logs/zcode"
