# 应用档案：arkcli（S2 重点层批量建档 2026-11-14；四问预填自现有契约，缺口留空待补）
[meta]
name = "arkcli"
kind = "agent"
summary = "火山引擎 CLI（skills 双根枢纽）"

[install]
scope = "user"
at = "user:apps/agent/.agents"
via = "人工渠道"
verify = "arkcli --version"

[config]
via = "skills 枢纽 ③ config/agents/skill"

[logs]
at = "host:Logs/arkcli"
