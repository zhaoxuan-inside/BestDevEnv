# 应用档案：opencode（S2 重点层批量建档 2026-11-14；四问预填自现有契约，缺口留空待补）
[meta]
name = "opencode"
kind = "agent"
summary = "AI CLI（契约位 ① apps/agent/.opencode/bin）"

[install]
scope = "user"
at = "user:apps/agent/.opencode"
via = "installer"
verify = "opencode --version"

[config]
via = "agents ③ 正本（runtime wire）"

[logs]
at = "host:Logs/opencode"
